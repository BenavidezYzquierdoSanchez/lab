AWSTemplateFormatVersion: '2010-09-09'
Description: 'FraudCloud con CSV procesado 339607 filas: S3 Glue Catalog Athena IAM Budget'
Parameters:
  ProjectName:
    Type: String
    Default: fraude-tarjetas
    AllowedPattern: '[a-z][a-z0-9-]{2,30}'
  DatabaseName:
    Type: String
    Default: fraude_tarjetas_db
    AllowedPattern: '[a-z][a-z0-9_]{2,80}'
    Description: Nombre de base Glue compatible con Amazon Athena (sin guiones)
  AlertEmail:
    Type: String
    Description: Correo que recibira las alertas de AWS Budgets
    AllowedPattern: '[^@ ]+@[^@ ]+\.[^@ ]+'
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    MinValue: 1
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawAcademicData
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: ExpireCuratedAcademicData
            Status: Enabled
            Prefix: curated/
            ExpirationInDays: 180
          - Id: ExpireAthenaQueryResults
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  DenyInsecureTransport:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Base catalogo de transacciones anonimizadas
  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ProjectScopedS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub '${DataBucket.Arn}/raw/*'
                  - !Sub '${DataBucket.Arn}/scripts/*'
                  - !Sub '${DataBucket.Arn}/curated/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${DataBucket.Arn}/curated/*'
  FraudETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-etl'
      Description: Valida es_fraude y monto_winsorizado_99, minimiza datos, escribe Parquet
      GlueVersion: '5.0'
      Role: !GetAtt GlueExecutionRole.Arn
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${DataBucket}/scripts/glue_etl.py'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 20
      MaxRetries: 0
      ExecutionProperty:
        MaxConcurrentRuns: 1
      DefaultArguments:
        '--job-language': python
        '--enable-job-insights': 'true'
        '--enable-observability-metrics': 'true'
        '--RAW_PATH': !Sub 's3://${DataBucket}/raw/transactions/'
        '--CURATED_PATH': !Sub 's3://${DataBucket}/curated/transactions/'
  FraudCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${ProjectName}-crawler'
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref GlueDatabase
      TablePrefix: 'fraud_'
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataBucket}/curated/transactions/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-wg'
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-monthly-usd'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
Outputs:
  BucketName:
    Value: !Ref DataBucket
  GlueJobName:
    Value: !Ref FraudETLJob
  CrawlerName:
    Value: !Ref FraudCrawler
  DatabaseName:
    Value: !Ref GlueDatabase
  AthenaWorkGroup:
    Value: !Ref AthenaWorkGroup
  AthenaOutput:
    Value: !Sub 's3://${DataBucket}/athena-results/'
